name: Feature request
description: Suggest a future capability or improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: input
    id: goal
    attributes:
      label: User or maintainer goal
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the problem and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
